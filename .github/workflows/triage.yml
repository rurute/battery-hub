name: Triage device reports

# Labels each new device report, closes copies of a device that was already reported, and keeps
# the "Most requested devices" issue current. The logic lives in .github/scripts/triage.js.
# Runs daily as well, so 👍 votes (which trigger nothing) still move devices up the list, and issues
# waiting a week for the reporter close (a comment from the reporter reopens them).

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const triage = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.js`);
            await triage.run({ github, context });
