name: Build (manual)

# Builds the Windows installer for trying out a branch, on the same Windows runner as release.yml,
# and keeps it as a workflow artifact. Publishes nothing: no release, no tag, no token.
#
#   gh workflow run build.yml -R rurute/battery-hub --ref <branch>
#   gh run watch -R rurute/battery-hub
#   scripts/download-build.sh      (faster than gh run download -R rurute/battery-hub -D dist/ci)
#
# Only the branded installer is kept: it carries the electron-builder installer inside it, so keeping
# both would double the download.
#
# The build is versioned X.Y.Z-fork.0.<run number> and updates from the fork's Releases, so the next
# fork release (X.Y.Z-fork.1 and up) replaces it. See docs/fork.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the fork version and publish target
        run: node scripts/fork-version.js --dev ${{ github.run_number }}

      - name: Build the electron-builder installer
        run: npm run dist -- --publish never

      # predist (npm run dist) builds taskbar-battery.exe; on CI the test fails if it wasn't built.
      - name: Self-test taskbar-battery.exe
        run: node --test test/taskbar-exe.test.js

      - name: Build the branded installer
        run: npm run installer

      # Branch names like feat/x have a slash, which an artifact name can't.
      - name: Name the artifact
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "ARTIFACT_NAME=battery-hub-${branch}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/Battery-Hub-Installer-*.exe
          if-no-files-found: error
          # An installer is already compressed; zipping it again only slows the upload.
          compression-level: 0
          retention-days: 14
